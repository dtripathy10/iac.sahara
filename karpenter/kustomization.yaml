apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - nodeclass.yaml
  - nodepool.yaml

helmCharts:
  - name: karpenter-crd
    releaseName: karpenter-crd
    namespace: kube-system
  - name: karpenter
    releaseName: karpenter
    namespace: kube-system
    valuesFile: values.yaml
